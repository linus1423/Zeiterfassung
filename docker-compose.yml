services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zeiterfassung
      POSTGRES_USER: zeiterfassung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeiterfassung"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeiterfassung:${POSTGRES_PASSWORD}@db:5432/zeiterfassung
      DJANGO_BEHIND_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn zeiterfassung.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # Vergessene Stempelungen beenden (Issue 7). Laeuft als eigener Dienst im
  # selben Stack, damit dafür kein Cronjob auf dem Host und kein Broker
  # gebraucht wird. Das Kommando ist unschaedlich, wenn es nichts zu tun gibt.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeiterfassung:${POSTGRES_PASSWORD}@db:5432/zeiterfassung
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
               python manage.py close_stale_entries || echo 'close_stale_entries fehlgeschlagen';
               sleep ${SCHEDULER_INTERVAL_SECONDS:-3600};
             done"

volumes:
  pgdata:
