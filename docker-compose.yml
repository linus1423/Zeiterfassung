services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeiterfassung
      POSTGRES_USER: zeiterfassung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeiterfassung -d zeiterfassung"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeiterfassung:${POSTGRES_PASSWORD}@db:5432/zeiterfassung
      DJANGO_BEHIND_PROXY: "true"
      # Der Einstiegspunkt wartet auf die Datenbank und migriert; das Kommando
      # steht im Image (siehe Dockerfile), damit Compose und Quadlet dasselbe
      # starten.
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Wiederkehrende Aufgaben: vergessene Stempelungen beenden (Issue 7), die
  # Erinnerungen verschicken (Issue 34) und die geplanten Exporte abschicken
  # (Issue 55). Läuft als eigener Dienst im selben
  # Stack, damit dafür kein Cronjob auf dem Host und kein Broker gebraucht
  # wird. Jedes Kommando ist unschädlich, wenn es nichts zu tun gibt, und ein
  # fehlgeschlagenes hält die übrigen nicht auf.
  # Unter Podman übernimmt das ein systemd-Timer, siehe docs/podman-quadlet.md.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeiterfassung:${POSTGRES_PASSWORD}@db:5432/zeiterfassung
    depends_on:
      db:
        condition: service_healthy
    # Kein Webserver im Container, also auch nichts anzufragen.
    healthcheck:
      disable: true
    command: >
      sh -c "while true; do
               python manage.py close_stale_entries || echo 'close_stale_entries fehlgeschlagen';
               python manage.py remind_open_entries || echo 'remind_open_entries fehlgeschlagen';
               python manage.py remind_pending_corrections || echo 'remind_pending_corrections fehlgeschlagen';
               python manage.py remind_period_closing || echo 'remind_period_closing fehlgeschlagen';
               python manage.py send_scheduled_exports || echo 'send_scheduled_exports fehlgeschlagen';
               sleep ${SCHEDULER_INTERVAL_SECONDS:-3600};
             done"

volumes:
  pgdata:
