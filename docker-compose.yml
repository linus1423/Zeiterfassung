services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: zeiterfassung
      POSTGRES_USER: zeiterfassung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der .env gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeiterfassung"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://zeiterfassung:${POSTGRES_PASSWORD}@db:5432/zeiterfassung
      DJANGO_BEHIND_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn zeiterfassung.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  pgdata:
