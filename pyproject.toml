[project]
name = "zeiterfassung"
version = "0.1.0"
description = "Zeiterfassung mit Gruppen, Tätigkeiten und Korrekturanträgen"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "C4"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]
"zeiterfassung/settings.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "zeiterfassung.settings"
python_files = ["test_*.py"]
addopts = "-q"
